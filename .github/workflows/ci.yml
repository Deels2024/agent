name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Validate production deployment workflow
        run: |
          grep -Fq 'DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}' .github/workflows/deploy.yml
          grep -Fq 'ServerAliveInterval=30' .github/workflows/deploy.yml
          grep -Fq 'docker compose -f docker-compose.server.yml up -d --build --wait' .github/workflows/deploy.yml
          grep -Fq 'http://127.0.0.1:8788/api/health' .github/workflows/deploy.yml
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
