name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Validate production deployment workflow
        run: |
          grep -Fq 'DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}' .github/workflows/deploy.yml
          grep -Fq 'ServerAliveInterval=30' .github/workflows/deploy.yml
          grep -Fq '/opt/bureau_nakhodok_suite/.env' .github/workflows/deploy.yml
          grep -Fq '.deploy.runtime.env' .github/workflows/deploy.yml
          grep -Fq -- '--env-file "$runtime_env"' .github/workflows/deploy.yml
          grep -Fq 'openai_gateway.py --check-upstream' .github/workflows/deploy.yml
          grep -Fq 'OpenAI gateway env:' .github/workflows/deploy.yml
          grep -Fq 'Worker runtime env:' .github/workflows/deploy.yml
          grep -Fq 'photoRecognition' .github/workflows/deploy.yml
          grep -Fq 'backgroundAutomation' .github/workflows/deploy.yml
          grep -Fq 'background job authentication probe failed' .github/workflows/deploy.yml
          grep -Fq 'automation_state' .github/workflows/deploy.yml
          grep -Fq 'http://127.0.0.1:8788/api/health' .github/workflows/deploy.yml
      - name: Validate container topology and secret exclusions
        run: |
          docker compose -f docker-compose.server.yml config --quiet
          grep -Fxq '.env' .dockerignore
          grep -Fxq '.env.*' .dockerignore
          grep -Fxq '.deploy.runtime.env' .dockerignore
          grep -Fxq '.openai-gateway-token' .dockerignore
          grep -Fxq '.cron-secret' .dockerignore
          grep -Fq '127.0.0.1:8788:8788' docker-compose.server.yml
          grep -Fq 'APISHIP_API_TOKEN:' docker-compose.server.yml
          grep -Fq 'OPENAI_VISION_MODEL:' docker-compose.server.yml
      - name: Validate auxiliary Python services
        run: python -m py_compile openai-gateway/openai_gateway.py automation/runner.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
