name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Validate forced-command deployment workflow
        run: |
          grep -Fq 'bash scripts/deploy-forced-client.sh' .github/workflows/deploy.yml
          bash -n scripts/deploy-forced-client.sh
          grep -Fq 'ServerAliveInterval=30' scripts/deploy-forced-client.sh
          grep -Fq 'ssh -T' scripts/deploy-forced-client.sh
          grep -Fq 'Verified health:' scripts/deploy-forced-client.sh
          grep -Fq 'photoRecognition' scripts/deploy-forced-client.sh
          grep -Fq 'backgroundAutomation' scripts/deploy-forced-client.sh
          ! grep -Fq 'bash -s' scripts/deploy-forced-client.sh
          ! grep -Fq 'docker compose' scripts/deploy-forced-client.sh
      - name: Validate self-contained production topology
        run: |
          docker compose -f docker-compose.server.yml config --quiet
          grep -Fq 'runtime-init:' docker-compose.server.yml
          grep -Fq '/opt/bureau_nakhodok_suite/.env:/run/integration/bureau.env:ro' docker-compose.server.yml
          grep -Fq 'buro_openai_secret:/run/bureau-openai:ro' docker-compose.server.yml
          grep -Fq 'name: bureau-nakhodok_openai_secret' docker-compose.server.yml
          grep -Fq 'BURO_OPENAI_KEY_FILE: /run/bureau-openai/openai_api_key' docker-compose.server.yml
          grep -Fq 'runtime_shared:/run/shared:ro' docker-compose.server.yml
          grep -Fq 'runtime_openai:/run/openai:ro' docker-compose.server.yml
          grep -Fq 'OPENAI_API_KEY_FILE: /run/openai/api_key' docker-compose.server.yml
          grep -Fq '127.0.0.1:8788:8788' docker-compose.server.yml
          grep -Fq 'APISHIP_API_TOKEN:' docker-compose.server.yml
          grep -Fxq '.env' .dockerignore
          grep -Fxq '.env.*' .dockerignore
      - name: Validate auxiliary Python services
        run: python -m py_compile openai-gateway/openai_gateway.py automation/runner.py runtime-init/init_runtime.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
