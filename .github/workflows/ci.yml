name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Validate forced-command deployment workflow
        run: |
          grep -Fq 'bash scripts/deploy-forced-client.sh' .github/workflows/deploy.yml
          bash -n scripts/deploy-forced-client.sh
          grep -Fq 'ServerAliveInterval=30' scripts/deploy-forced-client.sh
          grep -Fq 'ssh -T' scripts/deploy-forced-client.sh
          grep -Fq 'Verified health:' scripts/deploy-forced-client.sh
          grep -Fq 'photoRecognition' scripts/deploy-forced-client.sh
          grep -Fq 'backgroundAutomation' scripts/deploy-forced-client.sh
          grep -Fq 'verify_public_site' scripts/deploy-forced-client.sh
          grep -Fq 'Public site verified:' scripts/deploy-forced-client.sh
          ! grep -Fq 'bash -s' scripts/deploy-forced-client.sh
          ! grep -Fq 'docker compose' scripts/deploy-forced-client.sh
      - name: Validate deploy auto-recovery
        run: |
          grep -Fq 'cron: "*/15 * * * *"' .github/workflows/deploy.yml
          grep -Fq 'actions: read' .github/workflows/deploy.yml
          grep -Fq 'Decide scheduled recovery' .github/workflows/deploy.yml
          grep -Fq 'status=completed&per_page=1' .github/workflows/deploy.yml
          grep -Fq "conclusion == \"success\" and deployed_sha == current_sha" .github/workflows/deploy.yml
          grep -Fq "steps.recovery.outputs.run == 'true'" .github/workflows/deploy.yml
      - name: Validate self-contained production topology
        run: |
          docker compose -f docker-compose.server.yml config --quiet
          grep -Fq 'runtime-init:' docker-compose.server.yml
          grep -Fq 'AGENT_ENV_FILE: /run/integration/agent.env' docker-compose.server.yml
          grep -Fq '/root/agent/.env:/run/integration/agent.env:ro' docker-compose.server.yml
          ! grep -Fq './.env:/run/integration/agent.env:ro' docker-compose.server.yml
          grep -Fq '/opt/bureau_nakhodok_suite/.env:/run/integration/bureau.env:ro' docker-compose.server.yml
          grep -Fq 'OPENAI_API_KEY_FILE: /run/openai/api_key' docker-compose.server.yml
          grep -Fq 'runtime_shared:/run/shared:ro' docker-compose.server.yml
          grep -Fq 'runtime_openai:/run/openai:ro' docker-compose.server.yml
          grep -Fq 'OPENAI_PROXY_URL_FILE: /run/openai/proxy_url' docker-compose.server.yml
          grep -Fq 'agentEnvPresent' runtime-init/init_runtime.py
          grep -Fq 'agentEnvKeyPresence' runtime-init/init_runtime.py
          grep -Fq '0.0.0.0:8788:8788' docker-compose.server.yml
          ! grep -Fq '127.0.0.1:8788:8788' docker-compose.server.yml
          grep -Fq 'APISHIP_API_TOKEN:' docker-compose.server.yml
          grep -Fxq '.env' .dockerignore
          grep -Fxq '.env.*' .dockerignore
      - name: Validate auxiliary Python services
        run: python -m py_compile openai-gateway/openai_gateway.py automation/runner.py runtime-init/init_runtime.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
