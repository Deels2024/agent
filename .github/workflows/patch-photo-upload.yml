name: Patch photo upload

on:
  push:
    branches: [codex/photo-upload-production]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/photo-upload-production
      - name: Patch production photo upload
        run: python3 scripts/patch-photo-upload.py
      - name: Commit patch
        run: |
          if git diff --quiet -- app/live-search/page.tsx; then
            echo "Photo upload already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/live-search/page.tsx
          git commit -m "fix: compress photos before recognition upload"
          git push origin HEAD:codex/photo-upload-production
