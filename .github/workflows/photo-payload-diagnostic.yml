name: Photo payload diagnostic

on:
  push:
    branches: [codex/photo-production-diagnostic]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe JSON body-size path quickly
        run: |
          python3 - <<'PY'
          import json, subprocess
          for chars in (500_000, 900_000, 1_200_000, 2_000_000):
              # Syntactically valid base64, intentionally not a valid PNG. This isolates request-body handling from vision latency.
              data_url='data:image/png;base64,' + ('A' * chars)
              body=json.dumps({'imageDataUrl': data_url}).encode()
              open('/tmp/payload.json','wb').write(body)
              cmd=['curl','--silent','--show-error','--max-time','30','-o','/tmp/response.txt','-w','%{http_code}','-H','Content-Type: application/json','--data-binary','@/tmp/payload.json','http://5.183.191.139:8788/api/recognize']
              result=subprocess.run(cmd, capture_output=True, text=True)
              status=result.stdout.strip() or 'curl_error'
              try:
                  text=open('/tmp/response.txt','r',encoding='utf-8',errors='replace').read(250)
              except FileNotFoundError:
                  text=result.stderr[:250]
              print(json.dumps({'requestBytes': len(body), 'http': status, 'response': text}, ensure_ascii=False))
          PY
