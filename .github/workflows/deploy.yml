name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-agent
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '5.183.191.139 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL2znjGx+xsElDocnV/OCsk5UTosfxnzC79N0h8Apod7F8y/Gpxe6d8uE2/IsXSSVbqh98RlWbYImrF/LV/N2vI=' > ~/.ssh/known_hosts
      - name: Deploy buyer agent
        run: |
          set -Eeuo pipefail
          # This key is restricted by a server-side forced command. The server
          # updates /root/agent, runs Compose, and prints the final health JSON.
          for attempt in 1 2; do
            log_file="$(mktemp)"
            set +e
            ssh -T \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              root@5.183.191.139 2>&1 | tee "$log_file"
            ssh_status="${PIPESTATUS[0]}"
            set -e

            if [[ "$ssh_status" -eq 0 ]]; then
              python3 - "$log_file" <<'PY'
          import json
          import pathlib
          import sys

          health = None
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines():
              line = line.strip()
              if not line.startswith("{"):
                  continue
              try:
                  candidate = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if candidate.get("service") == "buyer-agent-backend":
                  health = candidate

          if health is None:
              print("Deployment completed but final backend health payload was not found", file=sys.stderr)
              raise SystemExit(1)

          print("Verified health:", json.dumps(health, ensure_ascii=False, separators=(",", ":")))
          errors = []
          if health.get("runtime", {}).get("database") != "ready":
              errors.append("Production database is not ready")
          if health.get("capabilities", {}).get("backgroundAutomation") is not True:
              errors.append("Background automation is not production-ready")
          if health.get("capabilities", {}).get("photoRecognition") is not True:
              diagnostic = health.get("runtime", {}).get("aiDiagnostic")
              errors.append("OpenAI photo recognition is not production-ready; aiDiagnostic=" + json.dumps(diagnostic, ensure_ascii=False))
          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          PY
              rm -f "$log_file"
              exit 0
            fi

            rm -f "$log_file"
            if [[ "$attempt" -eq 2 ]]; then
              echo "Deployment failed after $attempt attempts" >&2
              exit 1
            fi
            echo "SSH deployment attempt $attempt failed; retrying in 20 seconds" >&2
            sleep 20
          done
