name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-agent
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '5.183.191.139 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL2znjGx+xsElDocnV/OCsk5UTosfxnzC79N0h8Apod7F8y/Gpxe6d8uE2/IsXSSVbqh98RlWbYImrF/LV/N2vI=' > ~/.ssh/known_hosts
      - name: Deploy buyer agent
        run: |
          set -Eeuo pipefail
          # This SSH key is intentionally restricted by a server-side forced command.
          # The forced command updates /root/agent, runs Docker Compose and prints the
          # final health payload. Do not pass a remote shell command here: it is ignored.
          for attempt in 1 2; do
            log_file="$(mktemp)"
            if ssh -T \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              root@5.183.191.139 2>&1 | tee "$log_file"; then
              health_line="$(grep '"'"'service'"'"[[:space:]]*:[[:space:]]*"'"'buyer-agent-backend'"'"'" "$log_file" | tail -n 1 || true)"
              if [[ -z "$health_line" ]]; then
                echo "Deployment completed but final backend health payload was not found" >&2
                exit 1
              fi
              printf 'Verified health: %s\n' "$health_line"
              if ! printf '%s' "$health_line" | grep -Eq '"photoRecognition"[[:space:]]*:[[:space:]]*true'; then
                echo "OpenAI photo recognition is not production-ready; see aiDiagnostic above" >&2
                exit 1
              fi
              if ! printf '%s' "$health_line" | grep -Eq '"backgroundAutomation"[[:space:]]*:[[:space:]]*true'; then
                echo "Background automation is not production-ready" >&2
                exit 1
              fi
              if ! printf '%s' "$health_line" | grep -Eq '"database"[[:space:]]*:[[:space:]]*"ready"'; then
                echo "Production database is not ready" >&2
                exit 1
              fi
              exit 0
            fi
            rm -f "$log_file"
            if [ "$attempt" -eq 2 ]; then
              echo "Deployment failed after $attempt attempts" >&2
              exit 1
            fi
            echo "SSH deployment attempt $attempt failed; retrying in 20 seconds" >&2
            sleep 20
          done
