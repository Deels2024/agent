name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-agent
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '5.183.191.139 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL2znjGx+xsElDocnV/OCsk5UTosfxnzC79N0h8Apod7F8y/Gpxe6d8uE2/IsXSSVbqh98RlWbYImrF/LV/N2vI=' > ~/.ssh/known_hosts
      - name: Deploy buyer agent
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          deploy_path="${DEPLOY_PATH:-/root/agent}"
          case "$deploy_path" in
            /*) ;;
            *) echo "DEPLOY_PATH must be an absolute path" >&2; exit 64 ;;
          esac
          case "$deploy_path" in
            /|/root|/home) echo "DEPLOY_PATH is too broad" >&2; exit 64 ;;
          esac

          printf -v quoted_path '%q' "$deploy_path"
          for attempt in 1 2; do
            if ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              root@5.183.191.139 "bash -s -- $quoted_path" <<'REMOTE'
              set -Eeuo pipefail
              app_dir="$1"
              integration_env="/opt/bureau_nakhodok_suite/.env"

              test -d "$app_dir/.git"
              cd "$app_dir"
              git fetch --prune origin main
              git checkout -B main origin/main
              git reset --hard origin/main

              read_env_value() {
                local key="$1"
                local value
                value="$(sed -n "s/^${key}=//p" "$integration_env" 2>/dev/null | head -n 1 || true)"
                value="${value%$'\r'}"
                if [[ ${#value} -ge 2 ]]; then
                  local first="${value:0:1}"
                  local last="${value: -1}"
                  if [[ "$first" == "$last" && ( "$first" == '"' || "$first" == "'" ) ]]; then
                    value="${value:1:${#value}-2}"
                  fi
                fi
                printf '%s' "$value"
              }

              if [[ ! -f "$integration_env" ]]; then
                echo "OpenAI integration file is missing: $integration_env" >&2
                exit 78
              fi

              OPENAI_API_KEY="$(read_env_value OPENAI_API_KEY)"
              [[ -n "$OPENAI_API_KEY" ]] || OPENAI_API_KEY="$(read_env_value BN_OPENAI_API_KEY)"
              if [[ -z "$OPENAI_API_KEY" ]]; then
                echo "OPENAI_API_KEY is not configured in the server integration file" >&2
                exit 78
              fi

              OPENAI_PROXY_URL="$(read_env_value OPENAI_PROXY_URL)"
              for proxy_key in BN_OPENAI_PROXY_URL OPENAI_PROXY OPENAI_HTTPS_PROXY HTTPS_PROXY https_proxy ALL_PROXY all_proxy HTTP_PROXY http_proxy PROXY_URL PROXY; do
                [[ -n "$OPENAI_PROXY_URL" ]] && break
                OPENAI_PROXY_URL="$(read_env_value "$proxy_key")"
              done
              if [[ -z "$OPENAI_PROXY_URL" ]]; then
                echo "OpenAI proxy URL is not configured. Available proxy variable names:" >&2
                grep -E '^[A-Za-z_][A-Za-z0-9_]*PROXY[A-Za-z0-9_]*=' "$integration_env" 2>/dev/null | cut -d= -f1 >&2 || true
                exit 78
              fi

              OPENAI_VISION_MODEL="$(read_env_value OPENAI_VISION_MODEL)"
              [[ -n "$OPENAI_VISION_MODEL" ]] || OPENAI_VISION_MODEL="$(read_env_value BN_OPENAI_MODEL)"
              OPENAI_VISION_MODEL="${OPENAI_VISION_MODEL:-gpt-5.6-luna}"
              OPENAI_BASE_URL="http://openai-gateway:8080"

              gateway_token_file="$app_dir/.openai-gateway-token"
              if [[ ! -s "$gateway_token_file" ]]; then
                umask 077
                openssl rand -hex 32 > "$gateway_token_file"
              fi
              chmod 600 "$gateway_token_file"
              OPENAI_GATEWAY_TOKEN="$(cat "$gateway_token_file")"

              export OPENAI_API_KEY OPENAI_PROXY_URL OPENAI_VISION_MODEL OPENAI_BASE_URL OPENAI_GATEWAY_TOKEN

              docker compose -f docker-compose.server.yml config --quiet
              docker compose -f docker-compose.server.yml build openai-gateway app

              # Validate the new AI transport before replacing the running application.
              docker compose -f docker-compose.server.yml up -d --no-build openai-gateway
              gateway_id="$(docker compose -f docker-compose.server.yml ps -q openai-gateway)"
              gateway_healthy=false
              for _ in $(seq 1 30); do
                gateway_state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$gateway_id" 2>/dev/null || true)"
                if [[ "$gateway_state" == "healthy" ]]; then
                  gateway_healthy=true
                  break
                fi
                [[ "$gateway_state" == "unhealthy" ]] && break
                sleep 2
              done
              if [[ "$gateway_healthy" != "true" ]]; then
                echo "OpenAI gateway did not become healthy" >&2
                docker compose -f docker-compose.server.yml logs --tail=80 openai-gateway >&2 || true
                exit 1
              fi
              docker compose -f docker-compose.server.yml exec -T openai-gateway python /gateway/openai_gateway.py --check-upstream

              docker compose -f docker-compose.server.yml up -d --no-build --wait app
              health_payload="$(curl --retry 12 --retry-delay 2 --retry-connrefused --fail --silent --show-error http://127.0.0.1:8788/api/health)"
              printf '%s\n' "$health_payload"
              printf '%s' "$health_payload" | grep -Eq '"database"[[:space:]]*:[[:space:]]*"ready"'
              printf '%s' "$health_payload" | grep -Eq '"photoRecognition"[[:space:]]*:[[:space:]]*true'
              printf '%s' "$health_payload" | grep -Eq '"aiTransport"[[:space:]]*:[[:space:]]*"proxy-gateway"'
              printf 'Deployed agent commit %s\n' "$(git rev-parse HEAD)"
          REMOTE
            then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              echo "Deployment failed after $attempt attempts" >&2
              exit 1
            fi
            echo "SSH deployment attempt $attempt failed; retrying in 20 seconds" >&2
            sleep 20
          done
