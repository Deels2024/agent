name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: production-agent
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Decide scheduled recovery
        id: recovery
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current_sha="$(git rev-parse HEAD)"
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=completed&per_page=1")"
          RECOVERY_RESPONSE="$response" CURRENT_SHA="$current_sha" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          data = json.loads(os.environ["RECOVERY_RESPONSE"])
          current_sha = os.environ["CURRENT_SHA"]
          runs = data.get("workflow_runs") or []
          latest = runs[0] if runs else {}
          conclusion = latest.get("conclusion") or "missing"
          deployed_sha = latest.get("head_sha") or "missing"
          should_run = not (conclusion == "success" and deployed_sha == current_sha)
          print(f"run={'true' if should_run else 'false'}")
          print(f"reason=latest:{conclusion};deployed_sha:{deployed_sha};current_sha:{current_sha}")
          PY

      - name: Skip already healthy current release
        if: github.event_name == 'schedule' && steps.recovery.outputs.run != 'true'
        run: echo "Scheduled recovery skipped — latest successful deploy already matches current main."

      - name: Configure deployment key
        if: github.event_name != 'schedule' || steps.recovery.outputs.run == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '5.183.191.139 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL2znjGx+xsElDocnV/OCsk5UTosfxnzC79N0h8Apod7F8y/Gpxe6d8uE2/IsXSSVbqh98RlWbYImrF/LV/N2vI=' > ~/.ssh/known_hosts

      - name: Deploy buyer agent
        if: github.event_name != 'schedule' || steps.recovery.outputs.run == 'true'
        run: bash scripts/deploy-forced-client.sh
