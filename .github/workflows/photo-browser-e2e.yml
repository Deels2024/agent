name: Photo browser E2E

on:
  push:
    branches: [codex/photo-browser-e2e]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install temporary browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium
      - name: Download real JPEG
        run: |
          curl -fL --retry 3 -o /tmp/real.jpg https://raw.githubusercontent.com/mdn/learning-area/main/html/multimedia-and-embedding/images-in-html/dinosaur_small.jpg
          file /tmp/real.jpg
          ls -lh /tmp/real.jpg
      - name: Exercise production JPEG upload in Chromium
        run: |
          cat > photo-e2e.mjs <<'JS'
          import { chromium } from 'playwright';
          const origin = 'http://5.183.191.139:8788';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const consoleLines = [];
          page.on('console', msg => consoleLines.push(`console:${msg.type()}:${msg.text()}`));
          page.on('pageerror', err => consoleLines.push(`pageerror:${err.name}:${err.message}`));
          await page.goto(`${origin}/live-search`, {waitUntil:'networkidle', timeout:30000});
          await page.getByRole('button', {name:'По фото'}).click();
          const responsePromise = page.waitForResponse(r => r.url().includes('/api/recognize'), {timeout:60000})
            .then(async r => ({status:r.status(), text:(await r.text()).slice(0,1000)}))
            .catch(() => null);
          await page.locator('input[type=file]').setInputFiles('/tmp/real.jpg');
          const recognize = await responsePromise;
          await page.waitForTimeout(1000);
          const body = (await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,2500);
          console.log(JSON.stringify({recognize, body, console:consoleLines.slice(-20)}, null, 2));
          if (!recognize) process.exitCode = 2;
          await browser.close();
          JS
          node photo-e2e.mjs
