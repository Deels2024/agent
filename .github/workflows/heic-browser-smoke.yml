name: HEIC browser smoke

on:
  push:
    branches: [codex/photo-heic-browser-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Chromium and HEIC converter
        run: |
          mkdir -p /tmp/heic-smoke && cd /tmp/heic-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 heic-to@1.5.2 --ignore-scripts >/dev/null
          npx playwright install chromium >/dev/null
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/strukturag/libheif/master/examples/example.heic \
            -o example.heic
          cat > standalone.html <<'HTML'
          <!doctype html><html><body><div id="status">start</div><script type="module">
          import { heicTo } from '/node_modules/heic-to/dist/csp/heic-to.js';
          try {
            const source = await fetch('/example.heic').then(r => r.blob());
            const converted = await heicTo({ blob: source, type: 'image/jpeg', quality: 0.8 });
            document.querySelector('#status').textContent = `ok:${converted.type}:${converted.size}`;
          } catch (error) {
            document.querySelector('#status').textContent = `error:${error?.name}:${error?.message}`;
          }
          </script></body></html>
          HTML
      - name: Test converter standalone then production UI
        run: |
          cd /tmp/heic-smoke
          python3 -m http.server 4173 >/tmp/heic-http.log 2>&1 &
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const standalone = await browser.newPage();
            await standalone.goto('http://127.0.0.1:4173/standalone.html', { waitUntil: 'networkidle' });
            await standalone.waitForFunction(() => !document.querySelector('#status').textContent.startsWith('start'), null, { timeout: 90000 });
            const standaloneStatus = await standalone.locator('#status').innerText();
            console.log(`STANDALONE ${standaloneStatus}`);
            await standalone.close();

            const page = await browser.newPage();
            const network = [];
            page.on('console', msg => console.log(`CONSOLE ${msg.type()} ${msg.text()}`));
            page.on('pageerror', error => console.log(`PAGEERROR ${error.name}: ${error.message}`));
            page.on('requestfailed', request => console.log(`REQUESTFAILED ${request.url()} ${request.failure()?.errorText || ''}`));
            page.on('response', response => {
              if (response.status() >= 400 || response.url().includes('heic') || response.url().includes('/api/recognize')) {
                network.push(`${response.status()} ${response.url()}`);
              }
            });
            await page.goto('http://5.183.191.139:8788/live-search', { waitUntil: 'networkidle', timeout: 30000 });
            await page.getByRole('button', { name: 'По фото' }).click();
            await page.locator('input[type="file"]').setInputFiles('example.heic');
            await page.waitForFunction(() => {
              const text = document.body.innerText;
              return text.includes('Мы правильно определили товар?') || text.includes('Не получилось выполнить действие');
            }, null, { timeout: 110000 });
            const body = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            console.log(`PRODUCTION_BODY ${body.slice(0, 1000)}`);
            console.log(`NETWORK ${network.join(' | ')}`);
            const recognitionResponse = network.find(item => item.includes('/api/recognize')) || '';
            if (!recognitionResponse) throw new Error('Production UI never posted HEIC-converted image');
            if (body.includes('Не удалось преобразовать HEIC/HEIF')) throw new Error('Production HEIC conversion failed');
            await page.close();
          } finally {
            await browser.close();
          }
          JS
          node smoke.mjs
