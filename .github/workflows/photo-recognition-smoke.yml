name: Photo recognition smoke

on:
  push:
    branches: [codex/photo-recognition-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: POST a real PNG through public recognition endpoint
        run: |
          python3 - <<'PY'
          import base64, json, struct, zlib
          width = height = 256
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  # simple product-like dark earbud pair on light background
                  bg = (245, 245, 245)
                  left = (65 <= x <= 105 and 80 <= y <= 175)
                  right = (150 <= x <= 190 and 80 <= y <= 175)
                  band = (80 <= y <= 105 and 90 <= x <= 166)
                  pixel = (35, 35, 35) if left or right or band else bg
                  row.extend(pixel)
              rows.append(bytes(row))
          raw = b''.join(rows)
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          data_url = 'data:image/png;base64,' + base64.b64encode(png).decode()
          with open('payload.json', 'w', encoding='utf-8') as f:
              json.dump({'imageDataUrl': data_url}, f)
          PY
          status="$(curl --silent --show-error --max-time 110 -o response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json \
            http://5.183.191.139:8788/api/recognize)"
          echo "HTTP status: $status"
          python3 - "$status" <<'PY'
          import json, pathlib, sys
          status = int(sys.argv[1])
          text = pathlib.Path('response.json').read_text(encoding='utf-8', errors='replace')
          try:
              payload = json.loads(text)
          except Exception:
              print('Recognition endpoint returned non-JSON:', text[:300])
              raise SystemExit(1)
          safe = {k: payload.get(k) for k in ('error','code','suggestedQuery') if k in payload}
          if isinstance(payload.get('recognition'), dict):
              safe['recognition'] = {k: payload['recognition'].get(k) for k in ('productName','brand','model','confidence')}
          print('Recognition response:', json.dumps(safe, ensure_ascii=False))
          # 200 proves full vision path. 422 also proves the image reached the model and only output parsing/classification was insufficient.
          if status not in (200, 422):
              raise SystemExit(1)
          PY
