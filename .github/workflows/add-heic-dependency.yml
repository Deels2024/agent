name: Add HEIC dependency

on:
  push:
    branches: [codex/photo-upload-heic-ratefix]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/photo-upload-heic-ratefix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install heic-to@1.5.2 --save --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: support HEIC photo conversion"
          git push origin HEAD:codex/photo-upload-heic-ratefix
