services:
  openai-gateway:
    build:
      context: .
      dockerfile: Dockerfile.openai-gateway
    restart: unless-stopped
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PROXY_URL: ${OPENAI_PROXY_URL:-}
      OPENAI_GATEWAY_TOKEN: ${OPENAI_GATEWAY_TOKEN:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-5.6-luna}
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8788
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG_PATH: /app/.wrangler/logs
      WRANGLER_STATE_DIR: /app/.wrangler/state
      AUTH_MODE: ${AUTH_MODE:-standalone}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://openai-gateway:8080}
      OPENAI_GATEWAY_TOKEN: ${OPENAI_GATEWAY_TOKEN:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-5.6-luna}
      WB_API_TOKEN: ${WB_API_TOKEN:-}
      WB_CLIENT_SECRET: ${WB_CLIENT_SECRET:-}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      YANDEX_MARKET_API_KEY: ${YANDEX_MARKET_API_KEY:-}
      YANDEX_MARKET_BUSINESS_ID: ${YANDEX_MARKET_BUSINESS_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      PAYMENT_MODEL: ${PAYMENT_MODEL:-disabled}
      PAYMENT_API_URL: ${PAYMENT_API_URL:-}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-}
      KYC_PROVIDER: ${KYC_PROVIDER:-}
      KYC_API_KEY: ${KYC_API_KEY:-}
      DELIVERY_PROVIDER: ${DELIVERY_PROVIDER:-}
      APISHIP_API_TOKEN: ${APISHIP_API_TOKEN:-}
      DELIVERY_API_KEY: ${DELIVERY_API_KEY:-}
      DELIVERY_WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      MONITORING_WEBHOOK_URL: ${MONITORING_WEBHOOK_URL:-}
      BACKUP_POLICY_CONFIRMED: ${BACKUP_POLICY_CONFIRMED:-false}
      LEGAL_OPERATOR_REQUISITES_CONFIRMED: ${LEGAL_OPERATOR_REQUISITES_CONFIRMED:-false}
      PRIVACY_PROCESSORS_CONFIRMED: ${PRIVACY_PROCESSORS_CONFIRMED:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      PUBLIC_ACCESS_ENABLED: ${PUBLIC_ACCESS_ENABLED:-false}
    volumes:
      - worker_state:/app/.wrangler
      - runtime_state:/app/.sites-runtime
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  automation:
    build:
      context: .
      dockerfile: Dockerfile.automation
    restart: unless-stopped
    init: true
    environment:
      APP_INTERNAL_URL: http://app:8788
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  worker_state:
  runtime_state:
